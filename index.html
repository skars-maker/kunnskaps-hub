<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunnskapshub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Passord-skjerm (vises til riktig passord er tastet inn) -->
<div class="passord-skjerm" id="passordSkjerm">
  <div class="passord-kort">
    <h1 class="passord-tittel">Kunnskapshub</h1>
    <p class="passord-undertekst">Skriv inn passordet for å få tilgang</p>
    <input type="password" id="passordFelt" placeholder="Passord" autocomplete="current-password">
    <button id="laasOppKnapp">Lås opp</button>
    <p class="passord-feilmelding" id="passordFeilmelding"></p>
  </div>
</div>

<div id="dashbordInnhold" style="display:none;">

<div class="dashbord-flyt" id="dashbordFlyt">

<!-- Stadion-bilde med klikkbare soner og chat oppå (erstatter topptekst og boks-grid) -->
<section class="stadion" id="stadion">
  <img class="stadion-bilde" src="bilder/dashboard-stadion.jpg" alt="Kunnskapshub – stadion med Kunnskap om læring, Day2Day, Ressurser, Brufaser og Referanser">

  <!-- Usynlige, klikkbare soner (prosent av bildets bredde/høyde) -->
  <button class="stadion-sone" data-omrade="laering" aria-label="Kunnskap om læring" style="left:6.19%; top:34.78%; width:16.81%; height:21.33%;"></button>
  <button class="stadion-sone" data-omrade="day2day" aria-label="Day2Day" style="left:25.06%; top:18.33%; width:14.75%; height:17.11%;"></button>
  <button class="stadion-sone" data-omrade="brufaser" aria-label="Brufaser" style="left:60.75%; top:18.33%; width:14.81%; height:17.11%;"></button>
  <button class="stadion-sone" data-omrade="referanser" aria-label="Referanser" style="left:79.31%; top:34.78%; width:16.81%; height:21.33%;"></button>
  <button class="stadion-sone" id="ressurserKnapp" aria-label="Ressurser" style="left:40.19%; top:34.22%; width:20.56%; height:26.78%;"></button>

  <!-- Chatbot-seksjon (ligger oppå bildet, i 16-meteren) -->
  <div class="chat-plassering">
    <section class="chat-seksjon" id="chatSeksjon">
      <div class="chat-topptekst">
        <h2>Spør Kunnskapshub</h2>
        <button class="tom-knapp" id="tomSporsmalKnapp">Tøm spørsmålsliste</button>
      </div>

      <div class="foreslatte-sporsmal" id="foreslatteSporsmal">
        <!-- 4 spørsmålsforslag fylles inn av app.js -->
      </div>

      <div class="chat-vindu" id="chatVindu">
        <!-- Meldinger vises her -->
      </div>

      <div class="chat-inntasting">
        <input type="text" id="chatInput" placeholder="Skriv et spørsmål...">
        <button id="sendKnapp">Send</button>
      </div>
    </section>
  </div>
</section>

<main>

  <!-- Artikkelvisning (vises når man klikker på et område) -->
  <section class="artikkel-visning" id="artikkelVisning" style="display:none;">
    <button class="tilbake-knapp" id="tilbakeKnapp">← Tilbake til dashboard</button>
    <h2 id="artikkelOmradeTittel"></h2>
    <div id="artikkelListe"></div>
  </section>

  <!-- Ressursvisning -->
  <section class="artikkel-visning" id="ressurserVisning" style="display:none;">
    <button class="tilbake-knapp" id="tilbakeFraRessurserKnapp">← Tilbake til dashboard</button>
    <h2>Ressurser</h2>
    <div id="ressursListe"></div>
  </section>

</main>

</div>

</div>

<script src="app.js"></script>
</body>
</html>
